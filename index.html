<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Results summary component - solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
       <div class="result">
            <section class="result__score">
                <div>
                    <h1>Your result</h1>
                    <div class="result__score-value">
                        <span data-score class="result__score-number">76</span>
                        <span>of 100</span>
                    </div>
                    <div class="result__score-description">
                        <span>Great</span>
                        <p>You scored higher than 65% of the people who have taken these tests.</p>
                    </div>
                </div>
            </section>
            <section class="result__summary">
                <div>
                    <h2>Summary</h2>
                    <ul class="result__summary-list" data-summary-list>
                        <li class="reaction">
                            <span class="result__summary-name">
                                <img src="./images/icon-reaction.svg" alt="">
                                <span>Reaction</span>
                            </span>
                            <span class="result__summary-score">
                                <strong>80</strong>
                                <span>/ 100</span>
                            </span>
                        </li>
                        <li class="memory">
                            <span class="result__summary-name">
                                <img src="./images/icon-memory.svg" alt="">
                                <span>Memory</span>
                            </span>
                            <span class="result__summary-score">
                                <strong>92</strong>
                                <span>/ 100</span>
                            </span>
                        </li>
                        <li class="verbal">
                            <span class="result__summary-name">
                                <img src="./images/icon-verbal.svg" alt="">
                                <span>Verbal</span>
                            </span>
                            <span class="result__summary-score">
                                <strong>61</strong>
                                <span>/ 100</span>
                            </span>
                        </li>
                        <li class="visual">
                            <span class="result__summary-name">
                                <img src="./images/icon-visual.svg" alt="">
                                <span>Visual</span>
                            </span>
                            <span class="result__summary-score">
                                <strong>72</strong>
                                <span>/ 100</span>
                            </span>
                        </li>
                    </ul>
                    <a href="#">Continue</a>
                </div>
            </section>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
